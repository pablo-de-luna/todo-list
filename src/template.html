<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
</head>
<body>
  <div id="content-grid">
    <header>
      <div>Todo app</div>
    </header>
    <nav id="nav-btns">
      <div>
        <ul>
          <li><button class="filter-btn" data-filter="all" type="button">All</button></li>
          <li><button class="filter-btn" data-filter="today" type="button">Today</button></li>
          <li><button class="filter-btn" data-filter="upcoming" type="button">Upcoming</button></li>
          <li><button class="filter-btn" data-filter="anytime" type="button">Anytime</button></li>
          <li><button class="filter-btn" data-filter="important" type="button">Important</button></li>
        </ul>
      </div>
      <div>
        <div>Projects</div>
        <ul id="nav-projects-btns">
        </ul>
      </div>
    </nav>
    <main>
      <h1 id="main-header">Today</h1>
      <div id="new-todo-card">Create new todo</div>
      <div id="cards-container"></div>
    </main>
  </div>

    <div>This will remove the project and all it's todos, are you sure?</div>
    <button type="button" data-action="confirm">Confirm</button>
    <button type="button" data-action="cancel">Cancel</button>
  </dialog> -->
</body>
</html>
